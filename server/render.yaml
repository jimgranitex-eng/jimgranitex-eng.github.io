services:
  - type: web
    name: silvius-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: FROM_EMAIL
        value: James <hello@silvius.world>
      - key: BASE_URL
        value: https://jimgranitex-eng-github-io.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://jimgranitex-eng.github.io,https://go.silvius.world
